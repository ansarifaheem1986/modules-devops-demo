name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment Environment
        required: true
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod

      action:
        description: Terraform Action
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

      plan_run_id:
        description: Required for apply; run ID of a successful plan for this environment and commit
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  TF_INPUT: false
  TF_IN_AUTOMATION: true
  TERRAFORM_VERSION: "1.16.5"

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    defaults:
      run:
        shell: bash
        working-directory: apps/devops-demo/infrastructure/tf

    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}

      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      TF_STATE_RESOURCE_GROUP: devops-iacc-dev-rg-01
      TF_STATE_STORAGE_ACCOUNT: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: module-stage-apps
      TF_STATE_KEY: devops-demo/${{ inputs.environment }}.tfstate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show runner details and capture workflow run ID
        id: run_details
        env:
          ACTIONS_RUNNER_NAME: ${{ runner.name }}
          ACTIONS_RUNNER_OS: ${{ runner.os }}
          ACTIONS_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail

          echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

          {
            echo "### GitHub Actions runner"
            echo "- Runner: \`$ACTIONS_RUNNER_NAME\`"
            echo "- OS / architecture: \`$ACTIONS_RUNNER_OS / $ACTIONS_RUNNER_ARCH\`"
            echo "- Workflow run ID: \`$GITHUB_RUN_ID\`"
            echo "- Run attempt: \`$GITHUB_RUN_ATTEMPT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Terraform variables for selected environment
        run: |
          set -euo pipefail

          jq -e --arg environment "$DEPLOY_ENVIRONMENT" '
            . as $app
            | .environments[$environment] as $environment_config
            | if $environment_config == null then
                error("No devops-demo configuration exists for environment \($environment)")
              else
                {
                  pep_defaults: {
                    app_prefix: $app.app_prefix,
                    project_code: $app.project_code,
                    environment: $environment,
                    subscription_id: $environment_config.subscription_id,
                    resource_groups: $environment_config.resource_groups,
                    tags: ($app.tags // {})
                  },
                  resource_group_settings: ($environment_config.resource_group_settings // {})
                }
              end
          ' "$GITHUB_WORKSPACE/apps/devops-demo/devops-demo.json" \
            > terraform.tfvars.json

      - name: Show Environment Configuration
        run: |
          echo "Environment: $DEPLOY_ENVIRONMENT"
          echo "Backend Key: $TF_STATE_KEY"
          cat terraform.tfvars.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: |
          terraform init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}"

      - name: Verify State Backend
        run: |
          echo "Terraform state file:"
          echo "${TF_STATE_KEY}"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: inputs.action == 'plan'
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Show Plan Run ID for Apply
        if: inputs.action == 'plan'
        env:
          PLAN_RUN_ID: ${{ steps.run_details.outputs.run_id }}
          PLAN_ARTIFACT_NAME: tfplan-${{ inputs.environment }}-${{ steps.run_details.outputs.run_id }}
        run: |
          {
            echo "### Saved Terraform Plan"
            echo "- Environment: ${DEPLOY_ENVIRONMENT}"
            echo "- Plan Run ID: ${PLAN_RUN_ID}"
            echo "- State File: ${TF_STATE_KEY}"
            echo "- Artifact: ${PLAN_ARTIFACT_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record plan metadata
        if: inputs.action == 'plan'
        run: |
          jq -n \
            --arg environment "$DEPLOY_ENVIRONMENT" \
            --arg source_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{environment: $environment, source_sha: $source_sha, run_id: $run_id}' \
            > plan-metadata.json

      - name: Upload Plan
        if: inputs.action == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ steps.run_details.outputs.run_id }}
          path: |
            apps/devops-demo/infrastructure/tf/tfplan
            apps/devops-demo/infrastructure/tf/plan-metadata.json
          retention-days: 7

      - name: Validate Plan Run ID
        if: inputs.action == 'apply'
        run: |
          if [[ ! "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "For apply, provide the run ID from the successful plan run."
            exit 1
          fi

      - name: Download Plan
        if: inputs.action == 'apply'
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ inputs.plan_run_id }}
          path: apps/devops-demo/infrastructure/tf
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}

      - name: Verify Downloaded Plan
        if: inputs.action == 'apply'
        run: |
          set -euo pipefail

          jq -e \
            --arg environment "$DEPLOY_ENVIRONMENT" \
            --arg source_sha "$GITHUB_SHA" \
            --arg run_id "$PLAN_RUN_ID" \
            '.environment == $environment and .source_sha == $source_sha and .run_id == $run_id' \
            plan-metadata.json > /dev/null

          test -f tfplan

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: |
          terraform destroy \
            -input=false \
            -auto-approve