name: Terraform deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: App directory (not the resource naming prefix)
        type: choice
        required: true
        options:
          - devops-demo
      environment:
        description: Must exist in the selected app JSON
        type: choice
        required: true
        options: [sbx, dev, test, qa, stage, preprod, prod, dr]
      operation:
        description: Apply consumes the exact plan generated by this run
        type: choice
        default: plan
        required: true
        options: [plan, apply]

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.app }}-${{ inputs.environment }}-default
  cancel-in-progress: false

env:
  TF_INPUT: "false"
  TF_IN_AUTOMATION: "true"
  TF_WORKSPACE: default
  TERRAFORM_VERSION: 1.13.5

jobs:
  plan:
    name: Plan ${{ inputs.app }} / ${{ inputs.environment }}
    runs-on: ${{ fromJSON(vars.TERRAFORM_RUNNER_LABELS || '["self-hosted","linux","x64"]') }}
    environment: ${{ inputs.app }}-${{ inputs.environment }}-plan
    timeout-minutes: 60
    outputs:
      tf_root: ${{ steps.config.outputs.tf_root }}
      subscription_id: ${{ steps.config.outputs.subscription_id }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      AZURE_AGENT_IP: ${{ vars.AZURE_AGENT_IP }}
    steps:
      - name: Set run-specific temporary directories
        shell: bash
        run: |
          echo "CONFIG_DIR=$RUNNER_TEMP/edap-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-config" >> "$GITHUB_ENV"
          echo "BUNDLE_DIR=$RUNNER_TEMP/edap-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-plan" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Validate credentials and all app contracts
        shell: bash
        run: |
          set -euo pipefail
          : "${ARM_CLIENT_ID:?Set AZURE_CLIENT_ID}"
          : "${ARM_CLIENT_SECRET:?Set AZURE_CLIENT_SECRET}"
          : "${ARM_TENANT_ID:?Set AZURE_TENANT_ID}"
          : "${ARM_ACCESS_KEY:?Set TF_STATE_ACCESS_KEY}"

      - name: Generate configuration for this branch and app
        id: config
        shell: bash
        env:
          APP: ${{ inputs.app }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
      - name: Initialize, validate and save plan
        shell: bash
        working-directory: ${{ steps.config.outputs.tf_root }}
        env:
          ARM_SUBSCRIPTION_ID: ${{ steps.config.outputs.subscription_id }}
          VAR_FILE: ${{ steps.config.outputs.var_file }}
          ADO_MODULES_PAT: ${{ secrets.ADO_MODULES_PAT }}
        run: |
          set -euo pipefail
          if grep -q 'git::https://dev.azure.com/' ./*.tf; then
            : "${ADO_MODULES_PAT:?This app needs a read-only ADO_MODULES_PAT for private modules}"
            encoded="$(printf ':%s' "$ADO_MODULES_PAT" | base64 | tr -d '\n')"
            echo "::add-mask::$encoded"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=http.https://dev.azure.com/.extraheader
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: Basic $encoded"
          fi
          terraform init -input=false -backend-config="$CONFIG_DIR/backend.tfbackend.json"
          terraform validate -no-color
          args=()
          if [[ -n "$VAR_FILE" ]]; then
            args+=("-var-file=$VAR_FILE")
          fi
          terraform plan -input=false -lock-timeout=5m \
            "${args[@]}" -var-file="$CONFIG_DIR/deployment.tfvars.json" \
            -out=deployment.tfplan
      - name: Package exact plan, provider lock and downloaded module revisions
        shell: bash
        env:
          TF_ROOT: ${{ steps.config.outputs.tf_root }}
        run: |
          set -euo pipefail
          mkdir -p "$BUNDLE_DIR"
          tar -czf "$BUNDLE_DIR/deployment.tgz" \
            "$TF_ROOT/deployment.tfplan" "$TF_ROOT/.terraform.lock.hcl" "$TF_ROOT/.terraform/modules"
          cp "$CONFIG_DIR/backend.tfbackend.json" "$BUNDLE_DIR/backend.tfbackend.json"
          printf '%s\n' "$GITHUB_SHA" > "$BUNDLE_DIR/source-sha"
          printf '### Terraform plan\n- Commit: %s\n- App root: %s\n- Operation: review saved plan before approving apply\n' \
            "$GITHUB_SHA" "$TF_ROOT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.app }}-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 1
      - name: Remove local deployment material
        if: always()
        shell: bash
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          if [[ "$APP" =~ ^[a-z][a-z0-9-]*$ ]]; then
            rm -f -- "$GITHUB_WORKSPACE/apps/$APP/infrastructure/tf/deployment.tfplan"
          fi
          rm -f -- "$CONFIG_DIR/deployment.tfvars.json" "$CONFIG_DIR/backend.tfbackend.json"
          rm -f -- "$BUNDLE_DIR/deployment.tgz" "$BUNDLE_DIR/backend.tfbackend.json" "$BUNDLE_DIR/source-sha"

  apply:
    name: Apply reviewed plan
    needs: plan
    if: inputs.operation == 'apply'
    runs-on: ${{ fromJSON(vars.TERRAFORM_RUNNER_LABELS || '["self-hosted","linux","x64"]') }}
    environment: ${{ inputs.app }}-${{ inputs.environment }}-apply
    timeout-minutes: 60
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ needs.plan.outputs.subscription_id }}
      ARM_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}
      TF_ROOT: ${{ needs.plan.outputs.tf_root }}
    steps:
      - name: Set run-specific temporary directory
        shell: bash
        run: echo "BUNDLE_DIR=$RUNNER_TEMP/edap-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-apply" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.app }}-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BUNDLE_DIR }}
      - name: Restore and apply only this run's saved plan
        shell: bash
        run: |
          set -euo pipefail
          : "${ARM_CLIENT_ID:?Set AZURE_CLIENT_ID}"
          : "${ARM_CLIENT_SECRET:?Set AZURE_CLIENT_SECRET}"
          : "${ARM_TENANT_ID:?Set AZURE_TENANT_ID}"
          : "${ARM_ACCESS_KEY:?Set TF_STATE_ACCESS_KEY}"
          read -r planned_sha < "$BUNDLE_DIR/source-sha"
          [[ "$planned_sha" == "$GITHUB_SHA" ]] || { echo "Plan commit mismatch" >&2; exit 1; }
          tar -xzf "$BUNDLE_DIR/deployment.tgz" -C "$GITHUB_WORKSPACE"
          cd "$TF_ROOT"
          terraform init -input=false -lockfile=readonly \
            -backend-config="$BUNDLE_DIR/backend.tfbackend.json"
          terraform apply -input=false -lock-timeout=5m deployment.tfplan
          printf '### Terraform apply\nApplied saved plan for commit %s.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove local saved plan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$GITHUB_WORKSPACE/$TF_ROOT/deployment.tfplan"
          rm -f -- "$BUNDLE_DIR/deployment.tgz" "$BUNDLE_DIR/backend.tfbackend.json" "$BUNDLE_DIR/source-sha"
