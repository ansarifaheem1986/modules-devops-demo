name: Terraform CI

on:
  push:
    paths: ["apps/**", "modules/**", "scripts/**", "tests/**", ".github/workflows/terraform-*.yml"]
  pull_request:
    paths: ["apps/**", "modules/**", "scripts/**", "tests/**", ".github/workflows/terraform-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: node --test tests/*.test.mjs
      - run: node scripts/terraform-config.mjs --check
      - name: Identify authenticated validation requirements
        run: |
          echo "::warning::Corpaudit and GNRM use private ADO modules. Full Terraform validation for these two apps runs in the authenticated Terraform deploy workflow, not in this unprivileged CI workflow."
          printf '### Private module validation outstanding\nCorpaudit and GNRM require an authenticated deployment plan. CI contracts cover all 15 app roots; the Terraform validation matrix covers the 13 locally sourced apps including devops-demo and iacc-demo.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Check new module and integration formatting
        run: |
          terraform fmt -check modules/azure-resource-group apps/*/infrastructure/tf/resource-groups.tf
          terraform fmt -check -recursive modules/azure-aks-cluster apps/devops-demo/infrastructure/tf apps/iacc-demo/infrastructure/tf
      - name: Test resource group lookup and creation without Azure access
        working-directory: modules/azure-resource-group
        run: |
          terraform init -backend=false -input=false
          terraform test -no-color
      - name: Test demo module integration without Azure access
        working-directory: apps/devops-demo/infrastructure/tf
        run: |
          terraform init -backend=false -input=false
          terraform test -no-color
      - name: Test iacc-demo resource groups for dev, qa, stage and prod without Azure access
        working-directory: apps/iacc-demo/infrastructure/tf
        env:
          AZURE_AGENT_IP: 203.0.113.10
          TF_STATE_STORAGE_ACCOUNT: validationonly
          EDAP_ALLOW_PLACEHOLDER_SUBSCRIPTION: "true"
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform test -no-color
          for environment in dev qa stage prod; do
            config_dir="$RUNNER_TEMP/iacc-demo-$environment"
            node "$GITHUB_WORKSPACE/scripts/terraform-config.mjs" iacc-demo "$environment" "$config_dir"
            terraform test -no-color -test-directory=simulation -var-file="$config_dir/deployment.tfvars.json"
            rm -rf -- "$config_dir"
          done
      - name: Test public AKS module without Azure access
        working-directory: modules/azure-aks-cluster
        run: |
          terraform init -backend=false -input=false
          terraform test -no-color

  validate:
    name: Validate ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [connectados, croptrack, devops-demo, fpa, gcasf, halocrm, iacc-demo, latame2e, latamfam, latamlab, latamrm, latamtpo, tfgda]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Validate locally available app modules
        shell: bash
        working-directory: apps/${{ matrix.app }}/infrastructure/tf
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate -no-color