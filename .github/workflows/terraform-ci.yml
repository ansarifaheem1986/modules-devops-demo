name: Terraform CI

on:
  push:
    paths:
      - "apps/**"
      - "modules/**"
      - ".github/workflows/terraform-*.yml"

  pull_request:
    paths:
      - "apps/**"
      - "modules/**"
      - ".github/workflows/terraform-*.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show runner details and workflow run ID
        env:
          ACTIONS_RUNNER_NAME: ${{ runner.name }}
          ACTIONS_RUNNER_OS: ${{ runner.os }}
          ACTIONS_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          {
            echo "### GitHub Actions runner"
            echo "- Runner: \`$ACTIONS_RUNNER_NAME\`"
            echo "- OS / architecture: \`$ACTIONS_RUNNER_OS / $ACTIONS_RUNNER_ARCH\`"
            echo "- Workflow run ID: \`$GITHUB_RUN_ID\`"
            echo "- Run attempt: \`$GITHUB_RUN_ATTEMPT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false

      - name: Identify authenticated validation requirements
        run: |
          echo "::warning::Corpaudit and GNRM use private ADO modules. Full Terraform validation for these two apps runs in the authenticated Terraform deploy workflow, not in this unprivileged CI workflow."

      - name: Check Terraform formatting
        run: |
          terraform fmt -check modules/azure-resource-group
          terraform fmt -check -recursive modules/azure-vnet-subnet
          terraform fmt -check -recursive apps/devops-demo/infrastructure/tf
          terraform fmt -check -recursive apps/project-b/infrastructure/tf
          terraform fmt -check -recursive apps/project-c/infrastructure/tf

      - name: Test VNet subnet module
        working-directory: modules/azure-vnet-subnet
        run: |
          terraform init -backend=false -input=false
          terraform test -no-color

      - name: Test resource group module
        working-directory: modules/azure-resource-group
        run: |
          terraform init -backend=false -input=false
          terraform test -no-color

      - name: Test devops-demo module
        working-directory: apps/devops-demo/infrastructure/tf
        run: |
          terraform init -backend=false -input=false
          terraform test -no-color

      - name: Test project-b resource group integration
        working-directory: apps/project-b/infrastructure/tf
        run: |
          terraform init -backend=false -input=false
          terraform test -no-color

      - name: Test project-c resource group integration
        working-directory: apps/project-c/infrastructure/tf
        run: |
          terraform init -backend=false -input=false
          terraform test -no-color

  validate:
    name: Validate ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - devops-demo
          - project-b
          - project-c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show runner details and workflow run ID
        env:
          ACTIONS_RUNNER_NAME: ${{ runner.name }}
          ACTIONS_RUNNER_OS: ${{ runner.os }}
          ACTIONS_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          {
            echo "### GitHub Actions runner"
            echo "- Runner: \`$ACTIONS_RUNNER_NAME\`"
            echo "- OS / architecture: \`$ACTIONS_RUNNER_OS / $ACTIONS_RUNNER_ARCH\`"
            echo "- Workflow run ID: \`$GITHUB_RUN_ID\`"
            echo "- Run attempt: \`$GITHUB_RUN_ATTEMPT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false

      - name: Validate locally available app modules
        working-directory: apps/${{ matrix.app }}/infrastructure/tf
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate -no-color
